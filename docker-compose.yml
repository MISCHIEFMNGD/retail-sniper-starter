services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-sniper}
      POSTGRES_PASSWORD: ${PGPASSWORD:-sniper}
      POSTGRES_DB: ${PGDATABASE:-sniper}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.web"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "${APP_PORT:-8000}:8000"

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker", "collector"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker", "analyzer"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  whatsapp_alert_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker", "whatsapp"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
