services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-sniper}
      POSTGRES_PASSWORD: ${PGPASSWORD:-sniper}
      POSTGRES_DB: ${PGDATABASE:-sniper}
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.web"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
